name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip MuhammadiPublicSchoolApp.zip -d extracted_app

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find Project Root and Build APK
      run: |
        GRADLEW_PATH=$(find extracted_app -name gradlew -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "gradlew file not found!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          extracted_app/**/build/outputs/apk/debug/*.apk
          
