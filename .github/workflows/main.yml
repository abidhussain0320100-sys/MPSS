name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip MuhammadiPublicSchoolApp.zip -d extracted_app
        if [ -d "extracted_app/*" ]; then
          mv extracted_app/*/* extracted_app/ 2>/dev/null || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make Gradlew Executable
      run: |
        cd extracted_app
        chmod +x gradlew || true

    - name: Build APK with Gradle
      run: |
        cd extracted_app
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: extracted_app/app/build/outputs/apk/debug/app-debug.apk
        
