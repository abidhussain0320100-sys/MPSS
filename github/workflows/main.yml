name: Build Android APK from Zip

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip Project Files
      run: |
        echo "Unzipping updated project..."
        unzip -q MuhammadiPublicSchoolApp.zip -d project_files/
        ls -R project_files/

      run: 

    - name: Build APK with Gradle
      working-directory: ./project_files
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-debug-apk
        path: ./project_files/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
